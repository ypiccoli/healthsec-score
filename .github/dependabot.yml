version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Espera 7 dias depois de uma versão sair, para não pegar pacote comprometido logo no lançamento.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dependencias:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
