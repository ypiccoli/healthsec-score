name: Bug
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Problema de segurança? Não abra issue pública. Use a aba Security → Report a vulnerability."
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra a tela...\n2. Clique em...\n3. Veja o erro"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado e o que aconteceu
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e dispositivo
      placeholder: "Chrome no Windows, Safari no iPhone..."
