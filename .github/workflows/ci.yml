name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      existe: ${{ steps.app.outputs.existe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Até o projeto Vite existir, o job passa sem rodar nada.
      - name: Verifica se a aplicação existe
        id: app
        run: |
          if [ -f package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "Sem package.json: pulando lint, test e build."; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.existe == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        if: steps.app.outputs.existe == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.existe == 'true'
        run: npm run lint --if-present

      - name: Testes
        if: steps.app.outputs.existe == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.app.outputs.existe == 'true'
        run: npm run build

      - name: Confere a CSP no build
        if: steps.app.outputs.existe == 'true'
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html || { echo "CSP não encontrada em dist/index.html. Ver docs/seguranca.md."; exit 1; }

      - name: Empacota o site para o GitHub Pages
        if: steps.app.outputs.existe == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Publica só depois do ci passar, só a partir da main.
  deploy:
    name: deploy
    needs: ci
    if: needs.ci.outputs.existe == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publica.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publica
        id: publica
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
