name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Até o projeto Vite existir, o job passa sem rodar nada.
      - name: Verifica se a aplicação existe
        id: app
        run: |
          if [ -f package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "Sem package.json: pulando lint, test e build."; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.existe == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        if: steps.app.outputs.existe == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.existe == 'true'
        run: npm run lint --if-present

      - name: Testes
        if: steps.app.outputs.existe == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.app.outputs.existe == 'true'
        run: npm run build

      - name: Confere cabeçalhos de segurança no build
        if: steps.app.outputs.existe == 'true'
        run: |
          test -f dist/_headers || { echo "dist/_headers não encontrado. O arquivo public/_headers foi removido?"; exit 1; }
